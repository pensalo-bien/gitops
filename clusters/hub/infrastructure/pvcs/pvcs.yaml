apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sfera-data-db
  namespace: sfera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sfera-caddy
  namespace: sfera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
